name: Deploy to aaPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Production = server.dijitul.uk (aaPanel), app dir owned by the
      # `droptix` user, PM2 run by systemd unit pm2-droptix. Moved here
      # 2026-08-18 from the old CyberPanel box.
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          ssh "$USER@$HOST" "APP_DIR='$APP_DIR' bash -s" <<'EOSSH'
            set -euo pipefail
            cd "$APP_DIR"
            # Tracked files only: .env.production, uploads/, logs/ are
            # gitignored and aaPanel's .htaccess/.user.ini/404.html are
            # untracked, so reset --hard leaves them alone. Never add
            # `git clean` here.
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile --prod=false
            pnpm db:generate
            # No `db:push` here on purpose: the live DB lacks some FKs the
            # schema declares, so the first push would alter production.
            # Run schema changes by hand, deliberately.
            SKIP_BUILD_CHECKS=1 pnpm build
            # Standalone output doesn't include static assets or public/.
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/
            pm2 reload ecosystem.config.cjs --update-env
            pm2 save
            sleep 5
            curl -fsS --max-time 10 http://127.0.0.1:3001/api/health
          EOSSH
